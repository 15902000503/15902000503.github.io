name: Deploy Vue to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 安装 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.13.1 # 或者你本地使用的具体版本

      # 2. 设置 Node 环境，并把缓存改成 pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          #cache: "pnpm"

      # 3. 使用 pnpm 安装依赖并构建
      - run: pnpm install
      - run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - uses: actions/deploy-pages@v4
